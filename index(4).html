<!DOCTYPE html>
<html lang="az">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F7F8FC">
  <style>
    :root {
      --bg: #f7f8fc;
      --surface: rgba(255, 255, 255, 0.9);
      --surface-solid: #ffffff;
      --text: #16181d;
      --muted: #767c89;
      --line: #e9ebf1;
      --shadow: 0 22px 70px rgba(24, 28, 40, 0.08);
      --radius-xl: 32px;
      --radius-lg: 24px;
      --radius-md: 18px;
      --container: 1120px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--text);
      background:
        radial-gradient(circle at 8% 0%, rgba(109, 94, 252, 0.10), transparent 32%),
        radial-gradient(circle at 92% 16%, rgba(255, 96, 146, 0.09), transparent 28%),
        var(--bg);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }

    .top-actions {
      width: 100%;
      max-width: calc(var(--container) + 40px);
      margin: 0 auto;
      padding: 18px 20px 0;
      display: flex;
      justify-content: flex-end;
    }

    .pdf-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 44px;
      padding: 0 16px;
      border: 1px solid #e5e7ef;
      border-radius: 14px;
      background: rgba(255,255,255,.92);
      color: #242731;
      font: inherit;
      font-size: 13px;
      font-weight: 760;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(28, 32, 45, .07);
      transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
    }

    .pdf-button:hover {
      transform: translateY(-1px);
      border-color: #cbc7ff;
      box-shadow: 0 12px 34px rgba(28, 32, 45, .10);
    }

    .pdf-button:disabled {
      opacity: .58;
      cursor: wait;
      transform: none;
    }

    .pdf-button svg {
      width: 17px;
      height: 17px;
    }

    .instagram-webview .pdf-button {
      touch-action: manipulation;
    }

    .page-shell {
      width: 100%;
      max-width: calc(var(--container) + 40px);
      margin: 0 auto;
      padding: 28px 20px 64px;
    }

    .glass {
      background: var(--surface);
      border: 1px solid rgba(255,255,255,.82);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .profile-card {
      display: grid;
      grid-template-columns: 190px minmax(0, 1fr);
      gap: 34px;
      align-items: center;
      padding: 34px;
      border-radius: var(--radius-xl);
      overflow: hidden;
      position: relative;
    }

    .profile-card::after {
      content: "";
      position: absolute;
      width: 230px;
      height: 230px;
      right: -90px;
      bottom: -110px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(110, 92, 255, .14), rgba(255, 88, 141, .08));
      pointer-events: none;
    }

    .avatar-wrap {
      width: 190px;
      height: 190px;
      padding: 7px;
      border-radius: 50%;
      background: linear-gradient(145deg, #ffffff, #e9eaf3);
      box-shadow: 0 18px 45px rgba(34, 38, 54, .15);
      position: relative;
      z-index: 1;
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: #eceef5;
      display: block;
    }

    .avatar-fallback {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 52px;
      font-weight: 750;
      letter-spacing: -0.05em;
      color: #4c5060;
      background: linear-gradient(145deg, #f0f1f7, #ffffff);
    }

    .eyebrow {
      margin: 0 0 12px;
      color: #777d8b;
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1, h2, h3, p { margin-top: 0; }

    h1 {
      margin-bottom: 12px;
      font-size: clamp(32px, 5vw, 54px);
      line-height: 1.02;
      letter-spacing: -0.045em;
    }

    .location {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
      color: var(--muted);
      font-size: 14px;
    }

    .bio {
      max-width: 720px;
      margin-bottom: 0;
      color: #4e5360;
      font-size: 17px;
      line-height: 1.72;
    }

    .section {
      margin-top: 54px;
    }

    .updated {
      margin: 0 0 10px;
      color: #969ba7;
      font-size: 12px;
      letter-spacing: .01em;
    }

    .section-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    .section-kicker {
      margin: 0 0 7px;
      color: var(--muted);
      font-size: 14px;
    }

    .section-title {
      margin: 0;
      font-size: clamp(26px, 4vw, 38px);
      line-height: 1.1;
      letter-spacing: -0.035em;
    }

    .totals-card {
      padding: 28px;
      border-radius: var(--radius-xl);
      background: linear-gradient(135deg, rgba(255,255,255,.96), rgba(248,247,255,.94));
      border: 1px solid rgba(224, 222, 244, .9);
      box-shadow: 0 18px 56px rgba(35, 31, 67, .07);
      overflow: hidden;
      position: relative;
    }

    .totals-card::after {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      right: -110px;
      top: -120px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(109,94,252,.14), rgba(255,94,142,.08));
      pointer-events: none;
    }

    .totals-heading {
      position: relative;
      z-index: 1;
      margin-bottom: 20px;
    }

    .totals-heading h2 {
      margin: 0 0 6px;
      font-size: clamp(25px, 4vw, 36px);
      line-height: 1.1;
      letter-spacing: -0.035em;
    }

    .totals-heading p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .totals-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      position: relative;
      z-index: 1;
    }

    .total-item {
      min-height: 132px;
      padding: 22px;
      border-radius: 20px;
      background: rgba(255,255,255,.82);
      border: 1px solid rgba(232,232,241,.95);
    }

    .total-icon {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      color: #6557e8;
      background: #eeecff;
      margin-bottom: 17px;
    }

    .total-icon svg { width: 21px; height: 21px; }

    .total-value {
      font-size: clamp(32px, 6vw, 48px);
      line-height: 1;
      font-weight: 820;
      letter-spacing: -0.05em;
    }

    .total-label {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .last10-block {
      position: relative;
      z-index: 1;
      margin-top: 18px;
      padding-top: 20px;
      border-top: 1px solid rgba(224, 222, 244, .9);
    }

    .last10-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 14px;
    }

    .last10-heading h3 {
      margin: 0;
      font-size: 18px;
      letter-spacing: -0.025em;
    }

    .last10-heading p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
    }

    .last10-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .last10-platform {
      padding: 18px;
      border-radius: 20px;
      background: rgba(255,255,255,.82);
      border: 1px solid rgba(232,232,241,.95);
    }

    .last10-platform-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .last10-platform-name {
      font-size: 15px;
      font-weight: 760;
      letter-spacing: -0.015em;
    }

    .last10-values {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .last10-metric {
      min-width: 0;
      padding: 13px 14px;
      border-radius: 15px;
      background: #fafbfe;
      border: 1px solid #eff0f5;
    }

    .last10-value {
      font-size: clamp(23px, 4vw, 34px);
      line-height: 1;
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .last10-label {
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .summary-card {
      position: relative;
      overflow: hidden;
      min-height: 170px;
      padding: 24px;
      border-radius: var(--radius-lg);
      background: var(--surface-solid);
      border: 1px solid var(--line);
      box-shadow: 0 14px 44px rgba(26, 31, 44, .055);
      transition: transform .25s ease, box-shadow .25s ease;
    }

    .summary-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 50px rgba(26, 31, 44, .09);
    }

    .summary-card::after {
      content: "";
      position: absolute;
      width: 120px;
      height: 120px;
      right: -42px;
      bottom: -52px;
      border-radius: 50%;
      background: var(--accent-soft);
    }

    .platform-topline {
      display: flex;
      align-items: center;
      gap: 11px;
      position: relative;
      z-index: 1;
    }

    .platform-icon {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      color: var(--accent);
      background: var(--accent-soft);
      flex: 0 0 auto;
    }

    .platform-icon svg { width: 22px; height: 22px; }

    .platform-name {
      font-weight: 750;
      letter-spacing: -0.015em;
    }

    .platform-handle {
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
    }

    .summary-value {
      margin-top: 26px;
      position: relative;
      z-index: 1;
      font-size: clamp(30px, 5vw, 44px);
      line-height: 1;
      font-weight: 800;
      letter-spacing: -0.045em;
    }

    .summary-label {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
      position: relative;
      z-index: 1;
    }

    .platform-section {
      margin-top: 30px;
      padding: 28px;
      border-radius: var(--radius-xl);
      background: var(--surface-solid);
      border: 1px solid var(--line);
      box-shadow: 0 16px 54px rgba(25, 30, 42, .06);
    }

    .platform-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--line);
    }

    .platform-brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .platform-brand .platform-icon {
      width: 52px;
      height: 52px;
      border-radius: 17px;
    }

    .platform-brand h3 {
      margin: 0 0 4px;
      font-size: 24px;
      letter-spacing: -0.025em;
    }

    .profile-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: #4f5461;
      text-decoration: none;
      font-size: 13px;
      font-weight: 650;
      white-space: nowrap;
      transition: border-color .2s ease, background .2s ease;
    }

    .profile-link:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin: 20px 0;
    }

    .metric-card {
      min-height: 120px;
      padding: 20px;
      border-radius: var(--radius-md);
      background: #fafbfe;
      border: 1px solid #eff0f5;
    }

    .metric-label {
      color: var(--muted);
      font-size: 13px;
    }

    .metric-value {
      margin-top: 13px;
      font-size: clamp(28px, 5vw, 40px);
      line-height: 1;
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .audience-grid {
      display: grid;
      grid-template-columns: minmax(260px, .82fr) minmax(360px, 1.18fr);
      gap: 16px;
    }

    .audience-card {
      padding: 22px;
      border-radius: var(--radius-lg);
      background: #fafbfe;
      border: 1px solid #eff0f5;
      min-width: 0;
    }

    .audience-title {
      margin: 0 0 22px;
      font-size: 17px;
      letter-spacing: -0.02em;
    }

    .gender-layout {
      display: grid;
      grid-template-columns: 160px minmax(0, 1fr);
      gap: 22px;
      align-items: center;
    }

    .donut {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      position: relative;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.8);
    }

    .donut::after {
      content: "";
      position: absolute;
      inset: 24px;
      border-radius: 50%;
      background: #fafbfe;
      box-shadow: 0 8px 28px rgba(33, 38, 52, .08);
    }

    .donut-center {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: grid;
      place-content: center;
      text-align: center;
      pointer-events: none;
    }

    .donut-center strong {
      font-size: 26px;
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .donut-center span {
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
    }

    .legend {
      display: grid;
      gap: 13px;
    }

    .legend-row {
      display: grid;
      grid-template-columns: 12px minmax(0,1fr) auto;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .legend-label {
      color: #4f5460;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .legend-value {
      font-weight: 750;
      font-size: 14px;
    }

    .age-list {
      display: grid;
      gap: 16px;
    }

    .age-row {
      display: grid;
      grid-template-columns: 54px minmax(0, 1fr) 48px;
      align-items: center;
      gap: 12px;
    }

    .age-label {
      color: #555a67;
      font-size: 13px;
      font-weight: 650;
    }

    .age-track {
      height: 12px;
      overflow: hidden;
      border-radius: 999px;
      background: #ebeef4;
    }

    .age-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      transition: width .9s cubic-bezier(.2,.8,.2,1);
      box-shadow: inset 0 -1px 0 rgba(0,0,0,.06);
    }

    .age-value {
      text-align: right;
      font-size: 13px;
      font-weight: 750;
    }

    .contact-card {
      padding: 34px;
      border-radius: var(--radius-xl);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .contact-card::before,
    .contact-card::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    .contact-card::before {
      width: 170px;
      height: 170px;
      left: -80px;
      top: -90px;
      background: rgba(109, 94, 252, .12);
    }

    .contact-card::after {
      width: 210px;
      height: 210px;
      right: -100px;
      bottom: -120px;
      background: rgba(255, 94, 142, .10);
    }

    .contact-card h2 {
      margin-bottom: 12px;
      font-size: clamp(28px, 5vw, 40px);
      letter-spacing: -0.04em;
      position: relative;
      z-index: 1;
    }

    .contact-card p {
      max-width: 650px;
      margin: 0 auto;
      color: var(--muted);
      line-height: 1.65;
      position: relative;
      z-index: 1;
    }

    .contact-email {
      display: inline-block;
      margin-top: 18px;
      color: var(--text);
      font-size: clamp(18px, 4vw, 24px);
      font-weight: 780;
      letter-spacing: -0.025em;
      text-decoration: none;
      position: relative;
      z-index: 1;
    }

    .contact-email:hover { text-decoration: underline; }

    .social-links {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 26px;
      position: relative;
      z-index: 1;
    }

    .social-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 52px;
      padding: 0 18px;
      border-radius: 16px;
      background: #fff;
      border: 1px solid var(--line);
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      box-shadow: 0 10px 30px rgba(28, 32, 45, .06);
      transition: transform .2s ease, border-color .2s ease;
    }

    .social-link:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .profile-card,
    .totals-card,
    .summary-card,
    .platform-section,
    .contact-card,
    .last10-platform {
      break-inside: avoid;
      page-break-inside: avoid;
    }

    .footer {
      padding-top: 30px;
      color: #a0a4ae;
      text-align: center;
      font-size: 12px;
    }

    .loading {
      min-height: 72vh;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--muted);
    }

    .loader {
      width: 44px;
      height: 44px;
      margin: 0 auto 14px;
      border-radius: 50%;
      border: 4px solid #e4e6ed;
      border-top-color: #6d5efc;
      animation: spin .8s linear infinite;
    }

    .error-card {
      max-width: 680px;
      margin: 80px auto;
      padding: 30px;
      border-radius: 24px;
      background: #fff;
      border: 1px solid #ffd7d7;
      box-shadow: var(--shadow);
    }

    .error-card h2 { margin-bottom: 10px; }
    .error-card p { color: #6e737e; line-height: 1.6; }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 800px) {
      .top-actions { padding: 12px 14px 0; }
      .page-shell { padding: 14px 14px 46px; }

      .profile-card {
        grid-template-columns: 1fr;
        gap: 22px;
        padding: 28px 22px;
        text-align: center;
      }

      .avatar-wrap {
        width: 148px;
        height: 148px;
        margin: 0 auto;
      }

      .location { justify-content: center; }
      .bio { font-size: 15px; line-height: 1.68; }
      .section { margin-top: 42px; }
      .totals-card { padding: 24px 20px; }
      .last10-grid { grid-template-columns: 1fr; }
      .summary-grid { grid-template-columns: 1fr; }
      .summary-card { min-height: 148px; }
      .platform-section { padding: 20px; border-radius: 26px; }
      .platform-header { align-items: flex-start; }
      .audience-grid { grid-template-columns: 1fr; }
      .gender-layout { grid-template-columns: 140px minmax(0, 1fr); }
      .donut { width: 140px; height: 140px; }
      .contact-card { padding: 30px 20px; }
    }

    @media (max-width: 520px) {
      .page-shell { padding-left: 10px; padding-right: 10px; }
      .profile-card { padding: 24px 18px; border-radius: 26px; }
      .section-heading { align-items: flex-start; }
      .platform-header { display: grid; grid-template-columns: 1fr; }
      .profile-link { width: 100%; justify-content: center; }
      .totals-grid { grid-template-columns: 1fr; }
      .total-item { min-height: 118px; }
      .last10-heading { align-items: flex-start; flex-direction: column; }
      .last10-values { grid-template-columns: 1fr; }
      .metrics-grid { grid-template-columns: 1fr; }
      .metric-card { min-height: 106px; }
      .audience-card { padding: 18px; }
      .gender-layout { grid-template-columns: 1fr; justify-items: center; }
      .legend { width: 100%; }
      .age-row { grid-template-columns: 48px minmax(0,1fr) 42px; gap: 9px; }
      .social-links { display: grid; grid-template-columns: 1fr; }
      .social-link { justify-content: center; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; }
      .age-fill, .summary-card, .social-link { transition: none !important; }
      .loader { animation-duration: 1.5s; }
    }
  </style>
</head>
<body>
  <div class="top-actions" data-html2canvas-ignore="true">
    <button id="downloadPdfBtn" class="pdf-button" type="button">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 3v11m0 0 4-4m-4 4-4-4M5 18.5v1.2c0 .72.58 1.3 1.3 1.3h11.4c.72 0 1.3-.58 1.3-1.3v-1.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>PDF yüklə</span>
    </button>
  </div>

  <main id="app" class="page-shell">
    <div class="loading">
      <div>
        <div class="loader"></div>
        <div>Məlumatlar yüklənir...</div>
      </div>
    </div>
  </main>

  <script>
    var app = document.getElementById('app');
    var downloadPdfBtn = document.getElementById('downloadPdfBtn');
    var numberFormatter = new Intl.NumberFormat('az-AZ', { maximumFractionDigits: 0 });
    var currentProfileName = 'Media Kit';

    // GitHub Pages version: data comes directly from the public Google Sheet.
    // Only this ID needs to be changed.
    var SHEET_ID = 'ВСТАВЬ_ID_GOOGLE_SHEETS_СЮДА';
    var SHEET_NAME = 'MediaKit';
    var sheetScript = null;
    var sheetLoadTimer = null;

    var IS_INSTAGRAM_WEBVIEW = /Instagram|FBAN|FBAV/i.test(navigator.userAgent || '');
    if (IS_INSTAGRAM_WEBVIEW) {
      document.documentElement.classList.add('instagram-webview');
    }

    downloadPdfBtn.addEventListener('click', downloadPdf);
    loadPublicSheet();

    function loadPublicSheet() {
      if (!SHEET_ID || SHEET_ID.indexOf('ВСТАВЬ_') === 0) {
        renderError({ message: 'index.html faylında SHEET_ID sahəsinə Google Sheets ID-ni daxil edin.' });
        return;
      }

      if (sheetScript && sheetScript.parentNode) {
        sheetScript.parentNode.removeChild(sheetScript);
      }

      window.mediaKitSheetResponse = function(response) {
        if (sheetLoadTimer) {
          clearTimeout(sheetLoadTimer);
          sheetLoadTimer = null;
        }

        try {
          if (!response || response.status !== 'ok' || !response.table) {
            throw new Error('Google Sheets məlumatlarını oxumaq mümkün olmadı. Cədvələ “Anyone with the link → Viewer” girişi verin.');
          }

          var raw = tableToKeyValue_(response.table);
          var data = buildMediaKitData_(raw);
          renderPage(data);
        } catch (error) {
          renderError(error);
        }
      };

      var endpoint = 'https://docs.google.com/spreadsheets/d/' + encodeURIComponent(SHEET_ID) + '/gviz/tq'
        + '?sheet=' + encodeURIComponent(SHEET_NAME)
        + '&headers=1'
        + '&tqx=' + encodeURIComponent('responseHandler:mediaKitSheetResponse')
        + '&_=' + Date.now();

      sheetScript = document.createElement('script');
      sheetScript.src = endpoint;
      sheetScript.async = true;
      sheetScript.onerror = function() {
        if (sheetLoadTimer) clearTimeout(sheetLoadTimer);
        renderError({ message: 'Google Sheets ilə əlaqə qurmaq mümkün olmadı. Cədvəlin paylaşım icazəsini yoxlayın.' });
      };

      sheetLoadTimer = setTimeout(function() {
        renderError({ message: 'Google Sheets cavab vermədi. Cədvəlin “Anyone with the link → Viewer” rejimində olduğunu yoxlayın.' });
      }, 12000);

      document.head.appendChild(sheetScript);
    }

    function tableToKeyValue_(table) {
      var data = {};
      var rows = Array.isArray(table.rows) ? table.rows : [];

      rows.forEach(function(row) {
        var cells = row && Array.isArray(row.c) ? row.c : [];
        var keyCell = cells[0] || null;
        var valueCell = cells[1] || null;
        var key = keyCell && keyCell.v !== null && keyCell.v !== undefined ? String(keyCell.v).trim() : '';

        if (!key) return;

        var value = '';
        if (valueCell && valueCell.v !== null && valueCell.v !== undefined) {
          value = valueCell.v;
        }
        data[key] = value;
      });

      return data;
    }

    function buildMediaKitData_(data) {
      return {
        profile: {
          eyebrow: sheetGet_(data, 'eyebrow', 'MUSİQİ BLOQU · MEDIA KIT'),
          name: sheetGet_(data, 'profileName', 'Ad Soyad'),
          location: sheetGet_(data, 'location', 'Bakı, Azərbaycan'),
          avatarUrl: normalizeSheetImageUrl_(sheetGet_(data, 'avatarUrl', '')),
          bio: sheetGet_(data, 'bio', 'Özünüz haqqında qısa məlumat.'),
          updatedAt: sheetGet_(data, 'updatedAt', '')
        },
        intro: {
          statsTitle: sheetGet_(data, 'statsTitle', 'Sosial media göstəriciləri'),
          statsSubtitle: sheetGet_(data, 'statsSubtitle', 'Platformalar üzrə auditoriyam')
        },
        contact: {
          title: sheetGet_(data, 'contactTitle', 'Əməkdaşlıq üçün əlaqə'),
          text: sheetGet_(data, 'contactText', 'Reklam və tərəfdaşlıq təklifləri üçün sosial şəbəkələrdən mənimlə əlaqə saxlaya bilərsiniz.')
        },
        performance: {
          instagram: {
            averageViews30d: sheetPerformanceNumber_(data, 'instagramAverageViews30d', ['instagramAverageViews10', 'instagram_averageViews10', 'instagram_average_views_10']),
            medianViews30d: sheetPerformanceNumber_(data, 'instagramMedianViews30d', ['instagramMedianViews10', 'instagram_medianViews10', 'instagram_median_views_10']),
            engagementRate30d: sheetPerformancePercent_(data, 'instagramEngagementRate30d', [])
          },
          tiktok: {
            averageViews30d: sheetPerformanceNumber_(data, 'tiktokAverageViews30d', ['tiktokAverageViews10', 'tiktok_averageViews10', 'tiktok_average_views_10']),
            medianViews30d: sheetPerformanceNumber_(data, 'tiktokMedianViews30d', ['tiktokMedianViews10', 'tiktok_medianViews10', 'tiktok_median_views_10']),
            engagementRate30d: sheetPerformancePercent_(data, 'tiktokEngagementRate30d', [])
          }
        },
        platforms: [
          buildSheetPlatform_(data, 'instagram', 'Instagram', '#E74C83', '#FDECF3'),
          buildSheetPlatform_(data, 'tiktok', 'TikTok', '#101114', '#ECEDEF'),
          buildSheetPlatform_(data, 'youtube', 'YouTube', '#FF3B30', '#FFF0EE')
        ].filter(function(platform) { return platform.active; })
      };
    }

    function buildSheetPlatform_(data, id, defaultName, defaultAccent, defaultSoft) {
      return {
        id: id,
        name: sheetGet_(data, id + '_name', defaultName),
        handle: sheetGet_(data, id + '_handle', ''),
        followers: sheetToNumber_(sheetGet_(data, id + '_followers', 0)),
        views30d: sheetToNumber_(sheetGet_(data, id + '_views30d', 0)),
        profileUrl: sheetGet_(data, id + '_url', ''),
        accent: sheetGet_(data, id + '_accent', defaultAccent),
        accentSoft: sheetGet_(data, id + '_accentSoft', defaultSoft),
        active: sheetIsActive_(sheetGet_(data, id + '_active', true)),
        gender: [
          { label: sheetGet_(data, id + '_gender_1_label', 'Qadın'), value: sheetToPercent_(sheetGet_(data, id + '_gender_1_value', 0)), color: sheetGet_(data, id + '_gender_1_color', '#E74C83') },
          { label: sheetGet_(data, id + '_gender_2_label', 'Kişi'), value: sheetToPercent_(sheetGet_(data, id + '_gender_2_value', 0)), color: sheetGet_(data, id + '_gender_2_color', '#5B6CFF') }
        ],
        age: [1, 2, 3, 4, 5].map(function(index) {
          return {
            label: sheetGet_(data, id + '_age_' + index + '_label', ''),
            value: sheetToPercent_(sheetGet_(data, id + '_age_' + index + '_value', 0)),
            color: sheetGet_(data, id + '_age_' + index + '_color', defaultAccent)
          };
        }).filter(function(item) { return item.label; })
      };
    }

    function sheetGet_(data, key, fallback) {
      return Object.prototype.hasOwnProperty.call(data, key) && data[key] !== '' ? data[key] : fallback;
    }

    function sheetGetFirst_(data, keys) {
      for (var i = 0; i < keys.length; i++) {
        if (Object.prototype.hasOwnProperty.call(data, keys[i]) && data[keys[i]] !== '') return data[keys[i]];
      }
      return '';
    }

    function sheetOptionalNumber_(value) {
      if (value === null || value === undefined || String(value).trim() === '') return null;
      return sheetToNumber_(value);
    }

    function sheetOptionalPercent_(value) {
      if (value === null || value === undefined || String(value).trim() === '') return null;
      return sheetToPercent_(value);
    }

    function sheetPerformanceNumber_(data, newKey, legacyKeys) {
      if (Object.prototype.hasOwnProperty.call(data, newKey)) return sheetOptionalNumber_(data[newKey]);
      return sheetOptionalNumber_(sheetGetFirst_(data, legacyKeys || []));
    }

    function sheetPerformancePercent_(data, newKey, legacyKeys) {
      if (Object.prototype.hasOwnProperty.call(data, newKey)) return sheetOptionalPercent_(data[newKey]);
      return sheetOptionalPercent_(sheetGetFirst_(data, legacyKeys || []));
    }

    function sheetToNumber_(value) {
      if (typeof value === 'number' && isFinite(value)) return value;
      var normalized = String(value || '').replace(/\s/g, '').replace(/%/g, '').replace(/,/g, '.');
      var parsed = Number(normalized);
      return isFinite(parsed) ? parsed : 0;
    }

    function sheetToPercent_(value) {
      var number = sheetToNumber_(value);
      return number > 0 && number <= 1 ? Math.round(number * 1000) / 10 : Math.round(number * 10) / 10;
    }

    function sheetIsActive_(value) {
      if (value === false || value === 0) return false;
      var text = String(value === undefined || value === null ? '' : value).trim().toLowerCase();
      return ['false', '0', 'xeyr', 'no', 'off'].indexOf(text) === -1;
    }

    function normalizeSheetImageUrl_(url) {
      var value = String(url || '').trim();
      if (!value) return '';
      var fileMatch = value.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
      var idMatch = value.match(/[?&]id=([a-zA-Z0-9_-]+)/);
      var id = fileMatch ? fileMatch[1] : (idMatch ? idMatch[1] : '');
      return id ? 'https://drive.google.com/thumbnail?id=' + id + '&sz=w1200' : value;
    }

    function renderPage(data) {
      const platforms = Array.isArray(data.platforms) ? data.platforms : [];
      const profile = data.profile || {};
      const intro = data.intro || {};
      const contact = data.contact || {};
      const performance = data.performance || {};
      currentProfileName = profile.name || 'Media Kit';

      const totals = platforms.reduce((result, platform) => {
        result.followers += Number(platform.followers) || 0;
        result.views30d += Number(platform.views30d) || 0;
        return result;
      }, { followers: 0, views30d: 0 });

      app.innerHTML = `
        ${renderProfile(profile)}

        ${renderTotals(totals, profile.updatedAt, performance)}

        <section class="section" aria-labelledby="stats-title">
          <div class="section-heading">
            <div>
              <p class="section-kicker">${escapeHtml(intro.statsSubtitle || '')}</p>
              <h2 id="stats-title" class="section-title">${escapeHtml(intro.statsTitle || 'Sosial media göstəriciləri')}</h2>
            </div>
          </div>
          <div class="summary-grid">
            ${platforms.map(renderSummaryCard).join('')}
          </div>
        </section>

        <section class="section" aria-label="Platformalar üzrə ətraflı statistika">
          ${platforms.map(renderPlatformSection).join('')}
        </section>

        ${renderContact(contact, platforms)}
        <footer class="footer">Media Kit · ${new Date().getFullYear()}</footer>
      `;

      requestAnimationFrame(() => {
        document.querySelectorAll('.age-fill').forEach(el => {
          el.style.width = `${Math.max(0, Math.min(100, Number(el.dataset.value) || 0))}%`;
        });
      });
    }

    function renderTotals(totals, updatedAt, performance) {
      return `
        <section class="section" aria-labelledby="totals-title">
          <p class="updated">${updatedAt ? `Məlumat yenilənib: ${escapeHtml(updatedAt)}` : ''}</p>
          <div class="totals-card">
            <div class="totals-heading">
              <h2 id="totals-title">Ümumi göstəricilər</h2>
              <p>Bütün sosial şəbəkələr üzrə</p>
            </div>

            <div class="totals-grid">
              <div class="total-item">
                <div class="total-icon">${peopleIcon()}</div>
                <div class="total-value">${formatNumber(totals.followers)}</div>
                <div class="total-label">Ümumi izləyici sayı</div>
              </div>
              <div class="total-item">
                <div class="total-icon">${eyeIcon()}</div>
                <div class="total-value">${formatNumber(totals.views30d)}</div>
                <div class="total-label">Son 30 gündə ümumi baxış</div>
              </div>
            </div>

            ${renderPerformance30d(performance)}
          </div>
        </section>
      `;
    }

    function renderPerformance30d(performance) {
      const instagram = performance.instagram || {};
      const tiktok = performance.tiktok || {};

      const cards = [
        {
          id: 'instagram',
          name: 'Instagram',
          accent: '#E74C83',
          accentSoft: '#FDECF3',
          average: instagram.averageViews30d,
          median: instagram.medianViews30d,
          engagement: instagram.engagementRate30d
        },
        {
          id: 'tiktok',
          name: 'TikTok',
          accent: '#101114',
          accentSoft: '#ECEDEF',
          average: tiktok.averageViews30d,
          median: tiktok.medianViews30d,
          engagement: tiktok.engagementRate30d
        }
      ];

      return `
        <div class="last10-block">
          <div class="last10-heading">
            <div>
              <h3>Son 30 günün performansı</h3>
              <p>Orta baxış, median baxış və engagement rate</p>
            </div>
          </div>

          <div class="last10-grid">
            ${cards.map(item => `
              <div class="last10-platform" style="--accent:${item.accent};--accent-soft:${item.accentSoft}">
                <div class="last10-platform-head">
                  <div class="platform-icon">${platformIcon(item.id)}</div>
                  <div class="last10-platform-name">${item.name}</div>
                </div>

                <div class="last10-values">
                  <div class="last10-metric">
                    <div class="last10-value">${formatOptionalNumber(item.average)}</div>
                    <div class="last10-label">Orta baxış</div>
                  </div>
                  <div class="last10-metric">
                    <div class="last10-value">${formatOptionalNumber(item.median)}</div>
                    <div class="last10-label">Median baxış</div>
                  </div>
                  <div class="last10-metric">
                    <div class="last10-value">${formatOptionalPercent(item.engagement)}</div>
                    <div class="last10-label">Engagement rate</div>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderProfile(profile) {
      const initials = String(profile.name || 'M K')
        .split(/\s+/)
        .filter(Boolean)
        .slice(0, 2)
        .map(part => part[0])
        .join('')
        .toUpperCase();

      const avatar = safeUrl(profile.avatarUrl)
        ? `<img class="avatar" src="${escapeAttr(profile.avatarUrl)}" alt="${escapeAttr(profile.name || 'Profil şəkli')}" onerror="this.replaceWith(createAvatarFallback('${escapeJs(initials)}'))">`
        : `<div class="avatar-fallback">${escapeHtml(initials)}</div>`;

      return `
        <header class="profile-card glass">
          <div class="avatar-wrap">${avatar}</div>
          <div>
            <p class="eyebrow">${escapeHtml(profile.eyebrow || '')}</p>
            <h1>${escapeHtml(profile.name || '')}</h1>
            <div class="location">${pinIcon()}<span>${escapeHtml(profile.location || '')}</span></div>
            <p class="bio">${escapeHtml(profile.bio || '')}</p>
          </div>
        </header>
      `;
    }

    function renderSummaryCard(platform) {
      return `
        <article class="summary-card" style="--accent:${escapeAttr(platform.accent)};--accent-soft:${escapeAttr(platform.accentSoft)}">
          <div class="platform-topline">
            <div class="platform-icon">${platformIcon(platform.id)}</div>
            <div>
              <div class="platform-name">${escapeHtml(platform.name)}</div>
              <div class="platform-handle">${escapeHtml(platform.handle || '')}</div>
            </div>
          </div>
          <div class="summary-value">${formatNumber(platform.followers)}</div>
          <div class="summary-label">İzləyici</div>
        </article>
      `;
    }

    function renderPlatformSection(platform) {
      const url = safeUrl(platform.profileUrl);
      const gender = Array.isArray(platform.gender) ? platform.gender : [];
      const age = Array.isArray(platform.age) ? platform.age : [];

      return `
        <article class="platform-section" style="--accent:${escapeAttr(platform.accent)};--accent-soft:${escapeAttr(platform.accentSoft)}">
          <div class="platform-header">
            <div class="platform-brand">
              <div class="platform-icon">${platformIcon(platform.id)}</div>
              <div>
                <h3>${escapeHtml(platform.name)}</h3>
                <div class="platform-handle">${escapeHtml(platform.handle || '')}</div>
              </div>
            </div>
            ${url ? `<a class="profile-link" href="${escapeAttr(url)}" target="_blank" rel="noopener noreferrer">Profilə keç ${arrowIcon()}</a>` : ''}
          </div>

          <div class="metrics-grid">
            <div class="metric-card">
              <div class="metric-label">İzləyici sayı</div>
              <div class="metric-value">${formatNumber(platform.followers)}</div>
            </div>
            <div class="metric-card">
              <div class="metric-label">Son 30 gündə baxış</div>
              <div class="metric-value">${formatNumber(platform.views30d)}</div>
            </div>
          </div>

          ${platform.id === 'youtube' ? '' : `
            <div class="audience-grid">
              <div class="audience-card">
                <h4 class="audience-title">Auditoriyanın cins bölgüsü</h4>
                ${renderGender(gender)}
              </div>
              <div class="audience-card">
                <h4 class="audience-title">Auditoriyanın yaş bölgüsü</h4>
                ${renderAge(age)}
              </div>
            </div>
          `}
        </article>
      `;
    }

    function renderGender(items) {
      if (!items.length) return '<p class="section-kicker">Məlumat əlavə edilməyib.</p>';

      const total = items.reduce((sum, item) => sum + Math.max(0, Number(item.value) || 0), 0) || 100;
      let current = 0;
      const segments = items.map(item => {
        const size = (Math.max(0, Number(item.value) || 0) / total) * 100;
        const start = current;
        current += size;
        return `${item.color} ${start.toFixed(2)}% ${current.toFixed(2)}%`;
      }).join(', ');

      const largest = [...items].sort((a, b) => Number(b.value) - Number(a.value))[0];

      return `
        <div class="gender-layout">
          <div class="donut" style="background:conic-gradient(${escapeAttr(segments)})">
            <div class="donut-center">
              <strong>${formatPercent(largest.value)}</strong>
              <span>${escapeHtml(largest.label)}</span>
            </div>
          </div>
          <div class="legend">
            ${items.map(item => `
              <div class="legend-row">
                <span class="legend-dot" style="background:${escapeAttr(item.color)}"></span>
                <span class="legend-label">${escapeHtml(item.label)}</span>
                <span class="legend-value">${formatPercent(item.value)}</span>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderAge(items) {
      if (!items.length) return '<p class="section-kicker">Məlumat əlavə edilməyib.</p>';

      return `
        <div class="age-list">
          ${items.map(item => `
            <div class="age-row">
              <div class="age-label">${escapeHtml(item.label)}</div>
              <div class="age-track">
                <div class="age-fill" data-value="${Number(item.value) || 0}" style="background:${escapeAttr(item.color)}"></div>
              </div>
              <div class="age-value">${formatPercent(item.value)}</div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderContact(contact, platforms) {
      const instagram = platforms.find(platform => platform.id === 'instagram');
      const instagramUrl = instagram ? safeUrl(instagram.profileUrl) : '';
      const email = 'jmamedov143@gmail.com';

      return `
        <section class="section contact-card glass" aria-labelledby="contact-title">
          <h2 id="contact-title">Əməkdaşlıq üçün əlaqə</h2>
          <p>Reklam və əməkdaşlıq təklifləri üçün e-poçt və ya Instagram vasitəsilə mənimlə əlaqə saxlaya bilərsiniz.</p>
          <a class="contact-email" href="mailto:${email}">${email}</a>
          ${instagramUrl ? `
            <div class="social-links">
              <a class="social-link" href="${escapeAttr(instagramUrl)}" target="_blank" rel="noopener noreferrer" style="--accent:${escapeAttr(instagram.accent)}">
                <span class="platform-icon" style="width:34px;height:34px;border-radius:11px">${platformIcon('instagram')}</span>
                <span>Instagram-a keç</span>
              </a>
            </div>
          ` : ''}
        </section>
      `;
    }

    function loadExternalScript(src, globalCheck) {
      if (globalCheck()) return Promise.resolve();

      return new Promise(function(resolve, reject) {
        const existing = document.querySelector('script[data-pdf-src="' + src + '"]');
        if (existing) {
          existing.addEventListener('load', function() {
            globalCheck() ? resolve() : reject(new Error('Library loaded but global is unavailable'));
          }, { once: true });
          existing.addEventListener('error', reject, { once: true });
          return;
        }

        const script = document.createElement('script');
        script.src = src;
        script.async = true;
        script.setAttribute('data-pdf-src', src);
        script.onload = function() {
          globalCheck() ? resolve() : reject(new Error('Library loaded but global is unavailable'));
        };
        script.onerror = function() {
          reject(new Error('PDF library could not be loaded'));
        };
        document.head.appendChild(script);
      });
    }

    async function ensurePdfLibraries() {
      await loadExternalScript(
        'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
        function() { return typeof window.html2canvas !== 'undefined'; }
      );

      await loadExternalScript(
        'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
        function() { return !!(window.jspdf && window.jspdf.jsPDF); }
      );
    }

    async function downloadPdf() {
      const originalHtml = downloadPdfBtn.innerHTML;
      downloadPdfBtn.disabled = true;
      downloadPdfBtn.innerHTML = '<span>PDF hazırlanır...</span>';

      try {
        // PDF libraries are loaded only when the button is pressed.
        // This keeps iPhone/Safari from blocking the initial page render on CDN requests.
        await ensurePdfLibraries();

        // Wait until fonts and images are ready so the PDF matches the page.
        if (document.fonts && document.fonts.ready) {
          await document.fonts.ready;
        }

        const images = Array.from(app.querySelectorAll('img'));
        await Promise.all(images.map(img => {
          if (img.complete) return Promise.resolve();
          return new Promise(resolve => {
            img.addEventListener('load', resolve, { once: true });
            img.addEventListener('error', resolve, { once: true });
          });
        }));

        await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));

        let rawName = String(currentProfileName || 'Media_Kit');
        if (rawName.normalize) rawName = rawName.normalize('NFKD');
        const cleanName = rawName
          .replace(/[^\w\s-]/g, '')
          .trim()
          .replace(/\s+/g, '_') || 'Media_Kit';

        const today = new Date();
        const datePart = [
          today.getFullYear(),
          String(today.getMonth() + 1).padStart(2, '0'),
          String(today.getDate()).padStart(2, '0')
        ].join('-');

        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({
          orientation: 'portrait',
          unit: 'mm',
          format: 'a4',
          compress: true
        });

        const pageWidth = pdf.internal.pageSize.getWidth();
        const pageHeight = pdf.internal.pageSize.getHeight();
        const marginX = 8;
        const marginTop = 8;
        const marginBottom = 9;
        const gap = 5;
        const contentWidth = pageWidth - (marginX * 2);
        const contentBottom = pageHeight - marginBottom;
        let cursorY = marginTop;
        let hasContent = false;

        // Export logical blocks separately. This avoids the browser canvas-height
        // limit that can cut a long page roughly in half.
        const blocks = [];
        const profile = app.querySelector('.profile-card');
        const totals = app.querySelector('.section[aria-labelledby="totals-title"]');
        const summary = app.querySelector('.section[aria-labelledby="stats-title"]');
        const platformSections = Array.from(app.querySelectorAll('.platform-section'));
        const contact = app.querySelector('.contact-card');

        if (profile) blocks.push(profile);
        if (totals) blocks.push(totals);
        if (summary) blocks.push(summary);
        blocks.push(...platformSections);
        if (contact) blocks.push(contact);

        for (const block of blocks) {
          const canvas = await html2canvas(block, {
            scale: 1.5,
            useCORS: true,
            allowTaint: false,
            backgroundColor: '#f7f8fc',
            logging: false,
            scrollX: 0,
            scrollY: -window.scrollY,
            windowWidth: Math.max(1200, document.documentElement.clientWidth)
          });

          const imgData = canvas.toDataURL('image/jpeg', 0.95);
          let drawWidth = contentWidth;
          let drawHeight = (canvas.height * drawWidth) / canvas.width;
          const maxSingleBlockHeight = contentBottom - marginTop;

          // In the unlikely case that one block is taller than a whole page,
          // scale that block down so it still remains intact instead of clipping.
          if (drawHeight > maxSingleBlockHeight) {
            const scale = maxSingleBlockHeight / drawHeight;
            drawHeight *= scale;
            drawWidth *= scale;
          }

          if (hasContent && cursorY + drawHeight > contentBottom) {
            pdf.addPage();
            cursorY = marginTop;
            hasContent = false;
          }

          const x = marginX + (contentWidth - drawWidth) / 2;
          pdf.addImage(imgData, 'JPEG', x, cursorY, drawWidth, drawHeight, undefined, 'FAST');
          cursorY += drawHeight + gap;
          hasContent = true;
        }

        // Small footer, rendered as real PDF text instead of another large canvas.
        if (cursorY + 8 > contentBottom) {
          pdf.addPage();
          cursorY = marginTop;
        }
        pdf.setFont('helvetica', 'normal');
        pdf.setFontSize(8);
        pdf.setTextColor(150, 154, 164);
        pdf.text(`Media Kit · ${today.getFullYear()}`, pageWidth / 2, cursorY + 2, { align: 'center' });

        pdf.save(`${cleanName}_Media_Kit_${datePart}.pdf`);
      } catch (error) {
        console.error('PDF yaradılmadı:', error);
        alert('PDF yaratmaq mümkün olmadı. Səhifəni yeniləyib bir daha cəhd edin.');
      } finally {
        downloadPdfBtn.disabled = false;
        downloadPdfBtn.innerHTML = originalHtml;
      }
    }

    function renderError(error) {
      const message = error && error.message ? error.message : String(error || 'Naməlum xəta');
      app.innerHTML = `
        <div class="error-card">
          <h2>Məlumatları yükləmək mümkün olmadı</h2>
          <p>${escapeHtml(message)}</p>
          <p>Code.gs faylında Google Sheets ID-ni və cədvəldə “MediaKit” adlı vərəqin mövcudluğunu yoxlayın.</p>
        </div>
      `;
    }

    function createAvatarFallback(initials) {
      const div = document.createElement('div');
      div.className = 'avatar-fallback';
      div.textContent = initials;
      return div;
    }

    function formatNumber(value) {
      return numberFormatter.format(Number(value) || 0);
    }

    function formatOptionalNumber(value) {
      if (value === null || value === undefined || value === '') return '—';
      return numberFormatter.format(Number(value) || 0);
    }

    function formatOptionalPercent(value) {
      if (value === null || value === undefined || value === '') return '—';
      const number = Number(value);
      if (!Number.isFinite(number)) return '—';
      return `${Number.isInteger(number) ? number : number.toFixed(1)}%`;
    }

    function formatPercent(value) {
      const number = Number(value) || 0;
      return `${Number.isInteger(number) ? number : number.toFixed(1)}%`;
    }

    function safeUrl(value) {
      try {
        const url = new URL(String(value || ''));
        return ['http:', 'https:'].includes(url.protocol) ? url.toString() : '';
      } catch (_) {
        return '';
      }
    }

    function escapeHtml(value) {
      return String(value === null || value === undefined ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/`/g, '&#096;');
    }

    function escapeJs(value) {
      return String(value || '')
        .replace(/\\/g, '\\\\')
        .replace(/'/g, "\\'")
        .replace(/\r?\n/g, ' ');
    }

    function platformIcon(id) {
      const key = String(id || '').toLowerCase();
      if (key === 'instagram') {
        return `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/><circle cx="17.7" cy="6.6" r="1.1" fill="currentColor"/></svg>`;
      }
      if (key === 'tiktok') {
        return `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M14.3 4.2c.55 2.15 1.8 3.55 4.1 4.05v3.05a8.1 8.1 0 0 1-4.1-1.18v5.05a5.25 5.25 0 1 1-4.55-5.2v3.1a2.2 2.2 0 1 0 1.45 2.1V4.2h3.1Z" fill="currentColor"/></svg>`;
      }
      if (key === 'youtube') {
        return `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20.1 6.2a2.65 2.65 0 0 0-1.87-1.87C16.58 3.9 12 3.9 12 3.9s-4.58 0-6.23.43A2.65 2.65 0 0 0 3.9 6.2C3.48 7.85 3.48 12 3.48 12s0 4.15.42 5.8a2.65 2.65 0 0 0 1.87 1.87c1.65.43 6.23.43 6.23.43s4.58 0 6.23-.43a2.65 2.65 0 0 0 1.87-1.87c.42-1.65.42-5.8.42-5.8s0-4.15-.42-5.8Z" fill="currentColor"/><path d="m10.3 15.35 4.45-3.35-4.45-3.35v6.7Z" fill="#fff"/></svg>`;
      }
      return `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.8"/><path d="M8.5 12h7M12 8.5v7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`;
    }

    function peopleIcon() {
      return `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M16 19.5v-1.2a4.3 4.3 0 0 0-4.3-4.3H7.3A4.3 4.3 0 0 0 3 18.3v1.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="9.5" cy="7.5" r="3.2" stroke="currentColor" stroke-width="1.8"/><path d="M16.4 10.7a3 3 0 0 0 0-5.8M18 14.2a4 4 0 0 1 3 3.9v1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`;
    }

    function eyeIcon() {
      return `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="2.8" stroke="currentColor" stroke-width="1.8"/></svg>`;
    }

    function pinIcon() {
      return `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 21s6-5.3 6-11a6 6 0 1 0-12 0c0 5.7 6 11 6 11Z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="10" r="2" fill="currentColor"/></svg>`;
    }

    function arrowIcon() {
      return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 16 16 8M10 8h6v6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    }
  </script>
